# EndoVis2017 — type task (8 classes: background + 7 instrument types)

dataset: endovis2017_type
data_root: /root/autodl-tmp/data/autonomous_surgery/public_data/endovis2017_type_processed
nclass: 8
crop_size: 490

epochs: 80
batch_size: 4
lr: 1.0e-5
lr_multi: 10.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

model: dpt
backbone: dinov2_base
backbone_checkpoint: /root/autodl-tmp/code/UniMatch-V2/pretrained/dinov2_vitb14_pretrain.pth
lock_backbone: False

boundary:
  enabled: false
  alpha: 0.1
  pos_weight: 20.0
  dice_weight: 0.5
  warmup_epochs: 3
  cutmix_edge_thickness: 2
  tangent_enabled: false
  tangent_weight: 0.1
  tangent_detach_seg: true
cls:
  enabled: false
  alpha: 0.1
  decoder_type: ml_decoder
  loss_type: asl
  detach_backbone: true
  warmup_epochs: 5
  hidden: 512
  num_heads: 8
  dropout: 0.1
  min_pixels: 32
  asl_gamma_neg: 4.0
  asl_gamma_pos: 0.0
  asl_clip: 0.05
