# arguments for dataset
dataset: cholecseg8k
data_root: /root/autodl-tmp/data/autonomous_surgery/public_data/cholecseg8k                # raw layout (videoNN/videoNN_XXXXX/frame_*_endo.png)
nclass: 13
crop_size: 490

# arguments for training
epochs: 60
batch_size: 4
lr: 0.00001
lr_multi: 10.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

# arguments for model
model: dpt
backbone: dinov2_base
backbone_checkpoint: /root/autodl-tmp/code/UniMatch-V2/pretrained/dinov2_vitb14_pretrain.pth
lock_backbone: False

boundary:
  enabled: false
  alpha: 0.1
  pos_weight: 15.0             # 13 classes -> denser boundaries than seg50
  dice_weight: 0.5
  warmup_epochs: 3
  cutmix_edge_thickness: 2
  tangent_enabled: false
  tangent_weight: 0.1
  tangent_detach_seg: true
cls:
  enabled: false
  alpha: 0.1
  decoder_type: ml_decoder
  loss_type: asl
  detach_backbone: true
  warmup_epochs: 5
  hidden: 512
  num_heads: 8
  dropout: 0.1
  min_pixels: 32
  asl_gamma_neg: 4.0
  asl_gamma_pos: 0.0
  asl_clip:      0.05
