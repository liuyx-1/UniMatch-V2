# EndoVis2018 — robotic scene segmentation (kidney + instruments)
# 12 classes, 1280x1024 source -> crop to 490 (DINOv2 patch=14 multiple)

dataset: endovis2018
data_root: /data/test/endovis2018_processed       # output of tools/prepare_endovis2018.py
nclass: 12
crop_size: 490                                     # 14 * 35

epochs: 80
batch_size: 4
lr: 1.0e-5
lr_multi: 10.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

model: dpt
backbone: dinov2_base
backbone_checkpoint: /data/code/UniMatch-V2-manifold/pretrained/dinov2_vitb14_pretrain.pth
lock_backbone: False

# === Enhancement toggles ===
debias:
  enabled: false
  tau: 1.0
  tau_warmup_epochs: 5
  running_decay: 0.99
  init_from_labeled: true
  prior_conf_thresh: 0.7
  sync_ddp: true
balance_reg:
  enabled: false
  weight: 0.03
  target: sqrt
  apply_to: both
boundary:
  enabled: false
  alpha: 0.1
  pos_weight: 18.0                  # 12 classes, between cholec (15) and endo (20)
  dice_weight: 0.5
  warmup_epochs: 3
  cutmix_edge_thickness: 2
  tangent_enabled: false
  tangent_weight: 0.1
  tangent_detach_seg: true
cls:
  enabled: false
  alpha: 0.1
  decoder_type: ml_decoder
  loss_type: asl
  detach_backbone: true
  warmup_epochs: 5
  hidden: 512
  num_heads: 8
  dropout: 0.1
  min_pixels: 32
  asl_gamma_neg: 4.0
  asl_gamma_pos: 0.0
  asl_clip: 0.05
  pos_weight_tau: 0.5
