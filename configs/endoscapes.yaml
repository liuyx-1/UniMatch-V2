# Endoscapes (full) — Seg50 protocol + 1-fps unlabeled pool (mu=7 by default).
# Identical class layout to endoscapes_seg50; differs ONLY in the unlabeled set:
#   endoscapes_seg50 : unlabeled = leftover Seg50 frames (mu = (1-r)/r ~ 3 @ r=25%)
#   endoscapes       : unlabeled = leftover Seg50 + 1-fps full pool, capped at mu=7
#
# Generate splits with:
#   python tools/prepare_endoscapes.py --root <raw> --out /data/test/endoscapes_full_processed \
#       --apply --ratios 10 20 25 30 50 --mu 7 --seed 42
# (No --no-pool flag.)

dataset: endoscapes
data_root: /data/test/endoscapes_full_processed   # output of tools/prepare_endoscapes.py (no --no-pool, mu=7)
nclass: 7
crop_size: 490

epochs: 80
batch_size: 4
lr: 0.00001
lr_multi: 10.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

model: dpt
backbone: dinov2_base
backbone_checkpoint: /data/code/UniMatch-V2-manifold/pretrained/dinov2_vitb14_pretrain.pth
lock_backbone: False

debias:
  enabled: false
  tau: 1.0
  tau_warmup_epochs: 5
  running_decay: 0.99
  init_from_labeled: true
  prior_conf_thresh: 0.7
  sync_ddp: true
boundary:
  enabled: false
  alpha: 0.1
  pos_weight: 20.0
